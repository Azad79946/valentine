<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be My Valentine?</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  height: 100vh;
  overflow: hidden;
  background: linear-gradient(135deg, #ffc1d9, #ff3f81);
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  color: #fff;
  position: relative;
}

.container {
  max-width: 500px;
  padding: 20px;
  z-index: 10;
}

h1 {
  font-family: 'Dancing Script', cursive;
  font-size: 2.8rem;
  margin-bottom: 10px;
}

.subtitle {
  font-style: italic;
  margin-bottom: 20px;
  font-size: 1rem;
}

.closing {
  margin-top: 20px;
  font-size: 0.95rem;
}

.bear {
  font-size: 60px;
  animation: bounce 1.5s infinite;
}

@keyframes bounce {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-20px); }
}

.buttons {
  margin-top: 30px;
  display: flex;
  justify-content: center;
  gap: 40px;
}

button {
  cursor: pointer;
  border: none;
  padding: 14px 35px;
  font-size: 1rem;
  border-radius: 50px;
  transition: 0.3s;
}

#yesBtn {
  background: linear-gradient(45deg, #ff1744, #ff4081);
  color: #fff;
  font-size: 1.2rem;
  box-shadow: 0 0 15px rgba(255,0,90,0.7);
}

#yesBtn:hover {
  box-shadow: 0 0 25px rgba(255,0,90,1);
  transform: scale(1.1);
}

#noBtn {
  background: #fff;
  color: #ff1744;
  border: 2px solid #ff1744;
  position: relative;
}

.heart {
  position: fixed;
  bottom: -20px;
  font-size: 20px;
  animation: floatUp linear infinite;
  opacity: 0;
}

@keyframes floatUp {
  0% { transform: translateY(0); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(-110vh); opacity: 0; }
}

.celebration {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #ff3f81, #ff1744);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 999;
  color: white;
  text-align: center;
}

.yay {
  font-size: 3rem;
  font-weight: bold;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); }
}

.spin {
  font-size: 60px;
  animation: spin 2s linear infinite;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.confetti {
  position: fixed;
  width: 8px;
  height: 8px;
  animation: explode 3s ease-out forwards;
}

@keyframes explode {
  0% { transform: translate(0,0); opacity: 1; }
  100% { transform: translate(var(--x), var(--y)); opacity: 0; }
}
</style>
</head>
<body>

<div class="container" id="mainContent">
  <div class="bear">🐻</div>
  <h1>Will You Be My Valentine, Sandhya? 💖</h1>
  <div class="subtitle">From the moment you smiled at me, my world hasn’t been the same… ❤️</div>

  <div class="buttons">
    <button id="yesBtn">Yes ❤️</button>
    <button id="noBtn">No</button>
  </div>

  <div class="closing">Every love story is beautiful, but ours is my favourite</div>
</div>

<script>

let hearts = [];
for (let i = 0; i < 15; i++) {
  let heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "💖";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (15 + Math.random() * 25) + "px";
  heart.style.animationDuration = (5 + Math.random() * 5) + "s";
  heart.style.animationDelay = Math.random() * 5 + "s";
  document.body.appendChild(heart);
  hearts.push(heart);
}

const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");

const messages = [
  "Nope, not an option!",
  "Try again!",
  "You sure about that?",
  "Not happening!",
  "Think again!"
];

let msgIndex = 0;

function moveNoButton() {
  const yesRect = yesBtn.getBoundingClientRect();
  const btnWidth = noBtn.offsetWidth;
  const btnHeight = noBtn.offsetHeight;

  let x, y;

  do {
    x = Math.random() * (window.innerWidth - btnWidth);
    y = Math.random() * (window.innerHeight - btnHeight);
  } while (
    x < yesRect.right + 20 &&
    x + btnWidth > yesRect.left - 20 &&
    y < yesRect.bottom + 20 &&
    y + btnHeight > yesRect.top - 20
  );

  noBtn.style.position = "fixed";
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";

  noBtn.innerText = messages[msgIndex];
  msgIndex = (msgIndex + 1) % messages.length;
}

noBtn.addEventListener("mouseenter", moveNoButton);
noBtn.addEventListener("click", moveNoButton);
noBtn.addEventListener("touchstart", moveNoButton);

yesBtn.addEventListener("click", () => {
  document.getElementById("mainContent").style.display = "none";
  hearts.forEach(h => h.remove());

  const celebration = document.createElement("div");
  celebration.className = "celebration";

  celebration.innerHTML = `
    <div class="yay">Yayyyy!! 🎉</div>
    <div class="spin">💍</div>
    <p style="margin-top:20px; font-size:1.2rem;">
      Sandhya, you just made me the happiest person alive. ❤️  
      I promise to cherish you, support you, and love you endlessly.
    </p>
  `;

  document.body.appendChild(celebration);

  for (let i = 0; i < 120; i++) {
    let conf = document.createElement("div");
    conf.className = "confetti";
    conf.style.background = `hsl(${Math.random()*360}, 100%, 50%)`;
    conf.style.left = "50%";
    conf.style.top = "50%";
    conf.style.setProperty("--x", (Math.random()*600 - 300) + "px");
    conf.style.setProperty("--y", (Math.random()*600 - 300) + "px");
    document.body.appendChild(conf);
  }
});

</script>

</body>
</html>
